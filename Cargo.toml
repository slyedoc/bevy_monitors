[package]
name = "bevy_monitors"
description = "A reactive(ish) crate for the bevy engine"

authors = [ "Freyja Moth" ]

license = "MIT OR Apache-2.0"
repository = "https://github.com/Freyja-moth/bevy_monitors"

version = "0.3.0"
edition = "2024"

[dependencies]
bevy_app = { git = "https://github.com/bevyengine/bevy", branch = "main" }
bevy_ecs = { git = "https://github.com/bevyengine/bevy", branch = "main" }
bevy_reflect = { git = "https://github.com/bevyengine/bevy", branch = "main" }

[dev-dependencies]
bevy = { git = "https://github.com/bevyengine/bevy", branch = "main", features = ["experimental_bevy_feathers"] }

# Build against the side-by-side fork checkout, same as the rest of the stack.
[patch."https://github.com/bevyengine/bevy"]
bevy = { path = "/home/slyedoc/code/f/bevy" }
bevy_a11y = { path = "/home/slyedoc/code/f/bevy/crates/bevy_a11y" }
bevy_animation = { path = "/home/slyedoc/code/f/bevy/crates/bevy_animation" }
